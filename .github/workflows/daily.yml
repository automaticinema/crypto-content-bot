name: Daily Crypto Post

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets and files
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_ME: ${{ secrets.TG_ME }}
        run: |
          echo "TG_TOKEN length: ${#TG_TOKEN}"
          echo "TG_CHAT: $TG_CHAT"
          echo "TG_ME length: ${#TG_ME}"
          ls -la

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_ME: ${{ secrets.TG_ME }}
        run: python3 -u bot.py
