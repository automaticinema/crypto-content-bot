name: daily-draft
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add drafts
          git commit -m "draft $(date +%F)" || echo "nothing to commit"
          git push
